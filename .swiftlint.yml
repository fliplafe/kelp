included: [Sources, Tests]
excluded: [.build]
disabled_rules:
  - line_length          # long lines are fine when they read as one statement
  - identifier_name
  - type_body_length
  - file_length
  - function_body_length
  - cyclomatic_complexity
  - large_tuple
  - nesting
  - opening_brace
  - statement_position
  - multiple_closures_with_trailing_closure
  - todo
opt_in_rules:
  - force_unwrapping
force_unwrapping:
  severity: warning
