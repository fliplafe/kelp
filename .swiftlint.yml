included: [Sources, Tests]
excluded: [.build]
disabled_rules:
  - identifier_name
  - large_tuple
  - nesting
  - opening_brace
  - statement_position
  - multiple_closures_with_trailing_closure
  - todo
  - optional_data_string_conversion   # String(decoding:as:) is the lossless form; the suggested String(bytes:encoding:) returns an optional
opt_in_rules:
  - force_unwrapping
force_unwrapping:
  severity: warning

# Limits, not style: a line, a function, a type or a file past these is one to split. (A command dispatcher's `switch`
# counts as one decision.)
line_length:
  warning: 200
  error: 300
  ignores_comments: true
  ignores_urls: true
function_body_length:
  warning: 80
  error: 150
cyclomatic_complexity:
  warning: 20
  error: 40
  ignores_case_statements: true
type_body_length:
  warning: 400
  error: 600
file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true
