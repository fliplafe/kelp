name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with: { xcode-version: latest-stable }
      - name: Cache SwiftPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-${{ runner.os }}-${{ hashFiles('Package.resolved') }}
      - name: Cache libghostty
        id: ghostty
        uses: actions/cache@v4
        with:
          path: Vendor/GhosttyKit.xcframework
          key: ghostty-${{ hashFiles('scripts/build-ghostty.sh') }}   # the script pins GHOSTTY_COMMIT
      - name: Build libghostty
        if: steps.ghostty.outputs.cache-hit != 'true'
        run: scripts/build-ghostty.sh
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Lint
        run: brew install swiftlint && swiftlint --quiet
